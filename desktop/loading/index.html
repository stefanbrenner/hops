<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HOPS</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        background: #0d1117; color: #e6edf3; display: flex; align-items: center; justify-content: center;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-user-select: none;
      }
      .box { text-align: center; max-width: 560px; padding: 24px; }
      h1 { font-size: 34px; letter-spacing: 0.08em; margin: 0 0 4px; }
      p { color: #9aa7b4; margin: 4px 0; }
      .spinner { width: 22px; height: 22px; margin: 22px auto; border: 3px solid #3a4656; border-top-color: #4f8cff;
        border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #error { display: none; text-align: left; background: rgba(248, 81, 73, 0.14); border: 1px solid rgba(248, 81, 73, 0.4);
        color: #ffb3ae; border-radius: 8px; padding: 12px 14px; margin-top: 18px; white-space: pre-wrap; font-size: 13px; }
      code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>HOPS</h1>
      <p>HOlomon Photometric Software</p>
      <div class="spinner" id="spinner"></div>
      <p id="status">Starting the analysis engine…</p>
      <div id="error"></div>
    </div>
    <script>
      // called from Rust if the Python backend does not start
      window.hopsStartFailed = function (message) {
        document.getElementById('spinner').style.display = 'none'
        document.getElementById('status').textContent = 'HOPS could not start.'
        const e = document.getElementById('error')
        e.style.display = 'block'
        e.textContent = message
      }
    </script>
  </body>
</html>
